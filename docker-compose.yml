services:
  backend:
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      FRONTEND_ORIGIN: http://localhost:3000
    volumes:
      - kestrel-data:/data
    # Only reachable from this machine.
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend

volumes:
  kestrel-data:
