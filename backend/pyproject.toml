[project]
name = "kestrel-jobs"
version = "0.1.0"
description = "Self-hosted, compliance-first job matcher: official job APIs, typed classification, and grounded answer suggestions."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "apscheduler>=3.10,<4",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# Optional read-only browsing. Cua Driver is the recommended backend; Playwright is the alternative.
browse = ["cua-driver>=0.28", "playwright>=1.47"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "types-defusedxml>=0.7.0.20260504",
]

[project.scripts]
kestrel = "kestrel.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kestrel"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A notice from the web framework's test client about its own HTTP dependency, not about Kestrel.
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx` with `starlette.testclient`"]

[tool.pyright]
include = ["kestrel"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "C4", "SIM", "RET", "PIE", "PERF", "PL", "RUF",
    "ASYNC", "PT", "T20", "ISC", "Q", "DTZ", "G", "LOG",
]
ignore = [
    "PLC0415",  # optional dependencies (browser backends, pypdf, docx) are imported where used
    "PLR2004",  # HTTP status codes such as 404 read clearly as plain numbers
    "N818",     # exception names like PolicyViolation read better without an Error suffix
    "RUF001", "RUF002", "RUF003",  # en dashes and similar typography in user-facing text are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108", "PLR2004", "PT018"]

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Query"]
